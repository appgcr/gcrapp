# Keeps the live API awake. Render's free plan puts the server to sleep after 15 minutes
# without visits; a sleeping server misses the reminders and the automatic check-out, and the
# first person to open the app waits ~1 minute. This pings /api/health every 5 minutes.
# (GitHub may run a scheduled job a few minutes late when it is busy; that is still inside 15.)
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API (wakes it if asleep)
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://gcrapp-api.onrender.com/api/health || echo 000)
            echo "try $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::warning::API did not answer with 200 after 4 tries"
